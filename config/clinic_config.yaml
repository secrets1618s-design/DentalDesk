# ============================================================================
# Clinic settings
# ============================================================================
# Edit the values below to match your real clinic. No coding needed — just
# change the text after each colon (:) and save the file.
#
# Rules to keep in mind while editing:
#   - Lines starting with # are just notes for humans and are ignored.
#   - Keep the quotation marks " " around text values.
#   - Keep the same indentation (spacing) as the lines around it.
#   - After you save this file, restart the app for your changes to apply.
# ============================================================================

clinic:
  name: "Your Clinic Name Here"
  general_hours: "Saturday-Thursday 9:00 AM - 9:00 PM, Friday closed"
  parking: "Free parking is available in front of the clinic."
  phone: "+966 5X XXX XXXX"

  # Written address shown to patients who ask where the clinic is.
  address: "Your clinic's street address, district, city, Saudi Arabia"

  # A shareable Google Maps link for the clinic. Easiest way to get one:
  # search your clinic's location on maps.google.com, click "Share",
  # then "Copy link", and paste it here between the quotes.
  google_maps_link: "https://maps.google.com/?q=REPLACE_WITH_YOUR_CLINIC_LINK"

  # A short caption describing your current offers/promotions. Sia sends
  # this alongside the brochure image whenever a patient asks about offers.
  offers_text: "Ask our staff about our current promotions!"

  # The brochure/offers image file. This is currently a SAMPLE placeholder
  # image (static/brochure.jpg) — replace that file with your own offers
  # image (keep the same filename, or change it here) to make Sia send your
  # real brochure instead of the sample.
  offers_image_filename: "brochure.jpg"

  # List any dates the clinic is fully closed (holidays, vacations, etc.)
  # Add or remove lines as needed. Format: "YYYY-MM-DD"
  holidays:
    - "2026-09-23"   # Saudi National Day (example — edit/remove as needed)

# ----------------------------------------------------------------------------
# Services and prices. Add, remove, or edit lines freely — just keep each
# service as a "- name: ... / price_sar: ..." pair like the examples below.
# ----------------------------------------------------------------------------
services:
  - name: "Consultation / Visit Fee"
    price_sar: 300
  - name: "Regular Checkup"
    price_sar: 150
  - name: "Teeth Cleaning"
    price_sar: 250
  - name: "Tooth Filling"
    price_sar: 300
  - name: "Root Canal Treatment"
    price_sar: 900
  - name: "Teeth Whitening"
    price_sar: 700

